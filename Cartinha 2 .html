<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Para Meu Grande Amor</title>

  <!-- Meta para responsividade -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Estilinho simples e romântico */
    body {
      margin: 0;
      background: linear-gradient(to bottom, #fff0f5, #ffffff);
      font-family: 'Georgia', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden; /* Evita scroll horizontal */
      padding: 10px; /* Pequeno padding para telas muito pequenas */
    }

    .carta {
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 700px;
      width: 100%; /* Para ficar 100% da largura do container/padding */
      box-sizing: border-box;
    }

    h1 {
      font-family: 'Brush Script MT', cursive;
      font-size: 36px;
      text-align: center;
      color: #d6336c;
      margin-bottom: 20px;
    }

    #mensagem {
      font-size: 18px;
      color: #444;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .botao {
      margin-top: 30px;
      display: block;
      background: #ff5c8a;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-left: auto;
      margin-right: auto;
      max-width: 200px;
      width: 100%;
      box-sizing: border-box;
      transition: background-color 0.3s ease;
    }

    .botao:hover {
      background: #e04d74;
    }

    .coraçao {
      width: 20px;
      height: 20px;
      background: red;
      position: absolute;
      transform: rotate(45deg);
      animation: subir 6s linear infinite;
    }

    .coraçao::before,
    .coraçao::after {
      content: "";
      position: absolute;
      background: red;
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }

    .coraçao::before {
      top: -10px;
      left: 0;
    }

    .coraçao::after {
      top: 0;
      left: -10px;
    }

    @keyframes subir {
      0% {
        bottom: 0;
        opacity: 1;
      }
      100% {
        bottom: 100vh;
        opacity: 0;
        transform: translateX(50px) rotate(45deg);
      }
    }

    /* Media Queries para responsividade */
    @media (max-width: 480px) {
      h1 {
        font-size: 28px;
      }

      #mensagem {
        font-size: 16px;
      }

      .carta {
        padding: 20px;
        border-radius: 10px;
      }

      .botao {
        font-size: 14px;
        padding: 10px 15px;
        max-width: 150px;
      }
    }

    @media (max-width: 320px) {
      h1 {
        font-size: 24px;
      }

      #mensagem {
        font-size: 14px;
      }

      .carta {
        padding: 15px;
      }

      .botao {
        font-size: 13px;
        padding: 8px 12px;
        max-width: 140px;
      }
    }

  </style>
</head>
<body>

  <div class="carta">
    <h1>Feliz Aniversário, meu amor</h1>
    <div id="mensagem"></div>
    <button class="botao" onclick="mostrarSurpresa()">Surpresa 💗</button>
  </div>

  <script>
    // Escreve o texto da carta como se fosse à mão
    const texto = `Meu anjinho,

Todo dia que passo com você é um dia que não posso dizer que sou capaz de esquecer, apesar dos problemas de memória é claro :)
quero te agradecer por tudo que você representa para mim, uma pessoa forte, corajosa, batalhadora, incrível, dentre muitas outras
qualidades presentes em ti. Você é muito especial para mim, não consigo descrever a imensidão do bem que me faz ter você comigo.
Espero que esse pequeno gesto com essa cartinha simples sejam do seu agrado. 
Eu te amo MUITO meu amorzinho, espero que nossos momentos daqui pra frente sejam maravilhosos.
Bjoss minha linda!!!`;

    let i = 0;
    const areaMensagem = document.getElementById("mensagem");

    function escrever() {
      if (i < texto.length) {
        areaMensagem.innerHTML += texto.charAt(i);
        i++;
        setTimeout(escrever, 40); // tempo entre as letras
      }
    }

    escrever();

    // Botão de surpresa
    function mostrarSurpresa() {
      alert("🌹 Surpresa! Você é o presente mais lindo que a vida me deu. Te amo! 💕");
    }

    // Corações subindo
    setInterval(() => {
      const coracao = document.createElement("div");
      coracao.className = "coraçao";
      coracao.style.left = Math.random() * 100 + "vw";
      coracao.style.bottom = "0";
      document.body.appendChild(coracao);

      setTimeout(() => {
        coracao.remove();
      }, 6000);
    }, 1000);
  </script>

</body>
</html>
